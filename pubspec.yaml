name: kidcol
version: 1.1.0+3-b
publish_to: none
description: Kidcol

isar_version: &isar_version 3.3.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  get: ^4.7.2
  isar_community:
    version: *isar_version
  isar_community_flutter_libs:
    version: *isar_version
  path_provider: ^2.1.5
  convex_bottom_bar: 3.2.0
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  printing: ^5.14.2
  pdf: ^3.11.3
  flutter_launcher_icons: ^0.14.3
  flutter_dotenv: ^5.1.0
  photo_view: ^0.15.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  # isar_generator:
  #   git:
  #     url: https://github.com/Kiruel/isar
  #     ref: fix/web_build
  #     path: packages/isar_generator
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: assets/launcher/ic_launcher.png
  android: true
  ios: true
  min_sdk_android: 21

  isar_community_generator:
    version: *isar_version

flutter:
  assets:
    - .env
    - assets/launcher/
  uses-material-design: true
