name: kidcol
version: 1.1.3+6
publish_to: none
description: Kidcol

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  get: ^4.7.2
  isar_community: 3.3.0
  isar_community_flutter_libs: 3.3.0
  path_provider: ^2.1.5
  convex_bottom_bar: 3.2.0
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  printing: ^5.14.2
  pdf: ^3.11.3
  flutter_launcher_icons: ^0.14.3
  flutter_dotenv: ^5.1.0
  photo_view: ^0.15.0
  slang: ^4.11.0
  slang_flutter: 4.11.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^9.0.0
  intl_phone_number_input: ^0.7.4+2
  shared_preferences: ^2.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  slang_build_runner: 4.11.0
  # isar_generator:
  #   git:
  #     url: https://github.com/Kiruel/isar
  #     ref: fix/web_build
  #     path: packages/isar_generator
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.3.0

flutter_launcher_icons:
  image_path: assets/launcher/ic_launcher.png
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/launcher/ic_launcher.png
  min_sdk_android: 23

flutter:
  assets:
    - .env
    - assets/launcher/
  uses-material-design: true

